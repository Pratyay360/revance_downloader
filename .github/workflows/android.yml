name: Android APK

on:
	push:
		branches: [main]
		tags: ["v*"]
	pull_request:
		branches: [main]
	workflow_dispatch:
		inputs:
			version:
				description: "Release version (e.g. 1.2.0). Becomes v<version>."
				required: true
				type: string
				default: "1.0.0"
			create_release:
				description: "Publish a GitHub Release for this build."
				type: boolean
				default: false

# Cancel an in-progress run for the same branch / tag.
concurrency:
	group: android-${{ github.ref }}
	cancel-in-progress: true

permissions:
	contents: write # needed for softprops/action-gh-release on tags

jobs:
	# -----------------------------------------------------------------
	# Debug APK on every push / PR — sanity check that the project builds.
	# -----------------------------------------------------------------
	build-debug:
		name: Debug APK
		runs-on: ubuntu-latest
		steps:
			- name: Checkout
				uses: actions/checkout@v4

			- name: Setup Bun
				uses: oven-sh/setup-bun@v2
				with:
					bun-version: latest

			- name: Install dependencies
				run: bun install --frozen-lockfile

			- name: Cache Gradle
				uses: actions/cache@v4
				with:
					path: |
						~/.gradle/caches
						~/.gradle/wrapper
					key: gradle-debug-${{ runner.os }}-${{ hashFiles('bun.lock') }}
					restore-keys: gradle-debug-${{ runner.os }}-

			- name: Setup Java 17
				uses: actions/setup-java@v4
				with:
					distribution: temurin
					java-version: "17"

			- name: Generate native Android project
				env:
					EXPO_NO_GIT_STATUS: "1"
				run: bunx expo prebuild --platform android --no-install

			- name: Build debug APK
				working-directory: android
				run: ./gradlew :app:assembleDebug --no-daemon

			- name: Upload debug APK
				uses: actions/upload-artifact@v4
				with:
					name: rd-manager-debug
					path: android/app/build/outputs/apk/debug/app-debug.apk
					if-no-files-found: error
					retention-days: 7

	# -----------------------------------------------------------------
	# Signed release APK on tags (v*) OR via manual dispatch with
	# create_release=true. Decodes the keystore from
	# ANDROID_KEYSTORE_BASE64, runs the signing patch script, builds
	# :app:assembleRelease, and (when triggered) attaches the artifact
	# to a GitHub Release for the supplied tag.
	# -----------------------------------------------------------------
	build-release:
		name: Release APK
		if: |
			startsWith(github.ref, 'refs/tags/v') ||
			(github.event_name == 'workflow_dispatch' && inputs.create_release)
		runs-on: ubuntu-latest
		env:
			# Tag to publish under. From a tag push, it's the tag itself.
			# From a manual dispatch, it's v<version>.
			release_tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
		steps:
			- name: Checkout
				uses: actions/checkout@v4

			- name: Setup Bun
				uses: oven-sh/setup-bun@v2
				with:
					bun-version: latest

			- name: Install dependencies
				run: bun install --frozen-lockfile

			- name: Cache Gradle
				uses: actions/cache@v4
				with:
					path: |
						~/.gradle/caches
						~/.gradle/wrapper
					key: gradle-release-${{ runner.os }}-${{ hashFiles('bun.lock') }}
					restore-keys: gradle-release-${{ runner.os }}-

			- name: Setup Java 17
				uses: actions/setup-java@v4
				with:
					distribution: temurin
					java-version: "17"

			- name: Decode keystore
				env:
					ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
				run: |
					set -euo pipefail
					if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
						echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. Add it under repo Settings → Secrets and variables → Actions."
						exit 1
					fi
					mkdir -p android/app
					echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

			- name: Generate native Android project
				env:
					EXPO_NO_GIT_STATUS: "1"
				run: bunx expo prebuild --platform android --no-install

			- name: Write gradle keystore properties
				working-directory: android
				run: |
					cat > keystore.properties <<EOF
					storeFile=release.keystore
					storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
					keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
					keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
					EOF

			- name: Patch gradle signing config
				run: node scripts/patch-android-signing.mjs

			- name: Build release APK
				working-directory: android
				env:
					ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
					ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
					ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
				run: ./gradlew :app:assembleRelease --no-daemon

			- name: Upload signed APK
				uses: actions/upload-artifact@v4
				with:
					name: rd-manager-release
					path: android/app/build/outputs/apk/release/app-release.apk
					if-no-files-found: error
					retention-days: 30

			- name: Attach to GitHub Release
				if: github.event_name == 'workflow_dispatch'
				uses: softprops/action-gh-release@v2
				with:
					tag_name: ${{ env.release_tag }}
					name: ${{ env.release_tag }}
					files: android/app/build/outputs/apk/release/app-release.apk
					generate_release_notes: true
					fail_on_unmatched_files: true

			- name: Attach to GitHub Release (tag push)
				if: startsWith(github.ref, 'refs/tags/v')
				uses: softprops/action-gh-release@v2
				with:
					files: android/app/build/outputs/apk/release/app-release.apk
					generate_release_notes: true
					fail_on_unmatched_files: true